name: Visual QA

on:
  workflow_dispatch:

concurrency:
  group: visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Start WordPress development stack
        run: docker compose -f .devcontainer/docker-compose.yml up -d --wait db wordpress

      - name: Bootstrap WordPress
        run: |
          docker compose -f .devcontainer/docker-compose.yml run --rm bootstrap | tee /tmp/bootstrap.log
          grep -q EZB_BOOTSTRAP_OK /tmp/bootstrap.log

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture desktop and mobile screenshots
        run: node scripts/visual-qa.mjs

      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ezb-visual-qa
          path: visual-qa-output/
          retention-days: 14

      - name: Show logs on failure
        if: failure()
        run: docker compose -f .devcontainer/docker-compose.yml logs --no-color db wordpress bootstrap

      - name: Tear down
        if: always()
        run: docker compose -f .devcontainer/docker-compose.yml down -v
