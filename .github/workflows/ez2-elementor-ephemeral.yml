name: EZ2 Elementor Ephemeral Runtime (No Deployment)

on:
  pull_request:
    paths:
      - 'design/ez2-home-hero-candidate.json'
      - 'scripts/ez2_wp_runtime_probe.php'
      - 'scripts/ez2_elementor_controls_probe.php'
      - 'scripts/ez2_disposable_import.php'
      - 'scripts/test_ez2_disposable_import.php'
      - '.devcontainer/docker-compose.yml'
      - 'scripts/ez2_elementor_ephemeral_guard.py'
      - 'scripts/test_ez2_elementor_ephemeral_guard.py'
      - 'scripts/ez2_isolated_frontend_browser.mjs'
      - 'scripts/test_ez2_isolated_frontend_browser.mjs'
      - '.github/workflows/ez2-elementor-ephemeral.yml'

permissions:
  contents: read

jobs:
  ephemeral-elementor:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        elementor_version: ['4.3.4', '4.3.5']
    env:
      EZ2_ELEMENTOR_VERSION: ${{ matrix.elementor_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Validate exact candidate and ephemeral-only workflow
        run: |
          set -euo pipefail
          python3 scripts/ez2_elementor_ephemeral_guard.py
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Pull official container images
        run: |
          set -euo pipefail
          for image in mariadb:11 wordpress:7.1-php8.3-apache wordpress:cli; do
            pulled=0
            # Public ECR occasionally returns "Rate exceeded" before any WP test starts.
            for attempt in 1 2 3; do
              if docker pull "public.ecr.aws/docker/library/$image"; then
                docker tag "public.ecr.aws/docker/library/$image" "$image"
                pulled=1
                break
              fi
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
            done
            # Only official public Docker Hub image names; never pull from arbitrary registries.
            if [ "$pulled" -ne 1 ]; then
              for attempt in 1 2; do
                if docker pull "$image"; then
                  pulled=1
                  break
                fi
                if [ "$attempt" -lt 2 ]; then sleep 10; fi
              done
            fi
            if [ "$pulled" -ne 1 ]; then echo "EZ2_CONTAINER_PULL_UNAVAILABLE image=$image" >&2; exit 1; fi
          done
      - name: Install pinned Elementor Free in disposable WordPress only
        env:
          EZ2_PROJECT: ez2ci${{ github.run_id }}v${{ strategy.job-index }}
        run: |
          set -euo pipefail
          docker compose -p "$EZ2_PROJECT" -f .devcontainer/docker-compose.yml up -d --wait db wordpress
          docker compose -p "$EZ2_PROJECT" -f .devcontainer/docker-compose.yml run --rm bootstrap
          for key in home siteurl; do
            docker compose -p "$EZ2_PROJECT" -f .devcontainer/docker-compose.yml run --rm --entrypoint wp bootstrap option update "$key" http://ez2-review.local --allow-root
          done
          docker compose -p "$EZ2_PROJECT" -f .devcontainer/docker-compose.yml run --rm --entrypoint wp bootstrap option update ez2_site_identity ez2-isolated-only --allow-root
          docker compose -p "$EZ2_PROJECT" -f .devcontainer/docker-compose.yml run --rm --entrypoint wp bootstrap plugin install elementor --version="$EZ2_ELEMENTOR_VERSION" --activate --allow-root
          docker compose -p "$EZ2_PROJECT" -f .devcontainer/docker-compose.yml run --rm --entrypoint wp bootstrap plugin is-active elementor --allow-root
          docker compose -p "$EZ2_PROJECT" -f .devcontainer/docker-compose.yml run --rm -e EZ2_EXPECTED_HOST=ez2-review.local -e EZ2_EXPECTED_ELEMENTOR_VERSION="$EZ2_ELEMENTOR_VERSION" --entrypoint wp bootstrap eval-file /opt/ezb-scripts/ez2_wp_runtime_probe.php --allow-root | tee /tmp/ez2-runtime.json
          grep -Fq '"status": "READY_FOR_MANUAL_ELEMENTOR_FEATURE_TEST"' /tmp/ez2-runtime.json
          grep -Fq '"slideshow_ken_burns_verified": false' /tmp/ez2-runtime.json
          grep -Fq '"deployment_authorized": false' /tmp/ez2-runtime.json
          docker compose -p "$EZ2_PROJECT" -f .devcontainer/docker-compose.yml run --rm -e EZ2_EXPECTED_HOST=ez2-review.local -e EZ2_EXPECTED_ELEMENTOR_VERSION="$EZ2_ELEMENTOR_VERSION" --entrypoint wp bootstrap eval-file /opt/ezb-scripts/ez2_elementor_controls_probe.php --allow-root
          docker compose -p "$EZ2_PROJECT" -f .devcontainer/docker-compose.yml run --rm -e EZ2_DISPOSABLE_IMPORT=YES_SYNTHETIC_ONLY -e EZ2_EXPECTED_HOST=ez2-review.local -e EZ2_EXPECTED_ELEMENTOR_VERSION="$EZ2_ELEMENTOR_VERSION" --entrypoint wp bootstrap eval-file /opt/ezb-scripts/ez2_disposable_import.php --allow-root | tee /tmp/ez2-synthetic-import.log
          grep -Fq "EZ2_ELEMENTOR_SYNTHETIC_DRAFT_IMPORT_PASS version=$EZ2_ELEMENTOR_VERSION" /tmp/ez2-synthetic-import.log
          grep -Fq 'visual_qa_verified=false localwp_installed=false deployment_authorized=false' /tmp/ez2-synthetic-import.log
          echo "EZ2_ELEMENTOR_RUNTIME_VERSION_PASS version=$EZ2_ELEMENTOR_VERSION"
      - name: Install pinned Chromium and run isolated browser guards
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.56.1
          node --check scripts/ez2_isolated_frontend_browser.mjs
          node scripts/test_ez2_isolated_frontend_browser.mjs | tee /tmp/ez2-browser-guard.log
          grep -Fq 'EZ2_ISOLATED_BROWSER_GUARD_PASS cases=17' /tmp/ez2-browser-guard.log
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Browser-check isolated WordPress public homepage (not Elementor draft)
        env:
          EZ2_ISOLATED_BROWSER: YES_DISPOSABLE_ONLY
          EZ2_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          EZ2_BROWSER_OUTPUT: ${{ runner.temp }}/ez2-browser-${{ matrix.elementor_version }}
        run: |
          set -euo pipefail
          node scripts/ez2_isolated_frontend_browser.mjs
          test -s "$EZ2_BROWSER_OUTPUT/evidence.json"
          grep -Fq '"elementorDraftVerified": false' "$EZ2_BROWSER_OUTPUT/evidence.json"
          grep -Fq '"localwpVerified": false' "$EZ2_BROWSER_OUTPUT/evidence.json"
      - name: Preserve synthetic browser QA evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ez2-synthetic-browser-${{ matrix.elementor_version }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/ez2-browser-${{ matrix.elementor_version }}/
          if-no-files-found: ignore
          retention-days: 7
      - name: Destroy disposable test database and files
        if: always()
        env:
          EZ2_PROJECT: ez2ci${{ github.run_id }}v${{ strategy.job-index }}
        run: docker compose -p "$EZ2_PROJECT" -f .devcontainer/docker-compose.yml down -v --remove-orphans
