      - name: Verify quote form submission contract
        shell: bash
        run: |
          set -euo pipefail

          docker compose -f .devcontainer/docker-compose.yml exec -T wordpress sh -lc '
            mkdir -p /var/www/html/wp-content/mu-plugins
            printf "%s\n" "<?php" "add_filter( '\''pre_wp_mail'\'', function ( \$return, \$atts ) { \$to = is_array( \$atts['\''to'\'' ] ) ? implode( '\'', '\'', \$atts['\''to'\'' ] ) : \$atts['\''to'\'' ]; file_put_contents( '\''/tmp/ezb-ci-mail-to.txt'\'', \$to ); return true; }, 10, 2 );" > /var/www/html/wp-content/mu-plugins/ezb-ci-mail.php
          '

          docker compose -f .devcontainer/docker-compose.yml run --rm --entrypoint wp bootstrap option update ezb_quote_recipient_email 'quotes-ci@example.com' --allow-root >/dev/null

          curl -sS "http://127.0.0.1:8080/?ezb_page=contact" -o /tmp/contact-submit.html
          NONCE="$(grep -o 'name="ezb_quote_nonce" value="[^"]*"' /tmp/contact-submit.html | sed -E 's/.*value="([^"]*)"/\1/' | head -1)"
          test -n "$NONCE"

          VALID_CODE="$(curl -sS -o /tmp/valid-submit-body.html -D /tmp/valid-submit-headers.txt -w '%{http_code}'             -X POST 'http://127.0.0.1:8080/wp-admin/admin-post.php'             --data-urlencode 'action=ezb_quote'             --data-urlencode "ezb_quote_nonce=$NONCE"             --data-urlencode 'name=CI Form Test'             --data-urlencode 'email=ci-form@example.com'             --data-urlencode 'suburb=Melbourne 3000'             --data-urlencode 'product=Roller Blinds'             --data-urlencode 'message=Runtime submission contract test.')"
          test "$VALID_CODE" = "302"
          grep -qi 'location: .*quote_status=sent' /tmp/valid-submit-headers.txt
          test "$(docker compose -f .devcontainer/docker-compose.yml exec -T wordpress sh -lc 'cat /tmp/ezb-ci-mail-to.txt' | tr -d '\r\n')" = "quotes-ci@example.com"

          docker compose -f .devcontainer/docker-compose.yml run --rm --entrypoint wp bootstrap option update ezb_quote_recipient_email '' --allow-root >/dev/null
          docker compose -f .devcontainer/docker-compose.yml run --rm --entrypoint wp bootstrap option update admin_email 'admin-fallback@example.com' --allow-root >/dev/null

          FALLBACK_CODE="$(curl -sS -o /tmp/fallback-submit-body.html -D /tmp/fallback-submit-headers.txt -w '%{http_code}' \
            -X POST 'http://127.0.0.1:8080/wp-admin/admin-post.php' \
            --data-urlencode 'action=ezb_quote' \
            --data-urlencode "ezb_quote_nonce=$NONCE" \
            --data-urlencode 'name=CI Recipient Fallback' \
            --data-urlencode 'email=ci-fallback@example.com' \
            --data-urlencode 'product=Other / Not sure' \
            --data-urlencode 'message=Recipient fallback contract test.')"
          test "$FALLBACK_CODE" = "302"
          grep -qi 'location: .*quote_status=sent' /tmp/fallback-submit-headers.txt
          test "$(docker compose -f .devcontainer/docker-compose.yml exec -T wordpress sh -lc 'cat /tmp/ezb-ci-mail-to.txt' | tr -d '\r\n')" = "admin-fallback@example.com"

          # An invalid configured mailbox must use the existing valid admin fallback.
          INVALID_DESTINATION="$(docker compose -f .devcontainer/docker-compose.yml run --rm --entrypoint wp bootstrap eval '
            update_option("ezb_quote_recipient_email", "not-an-email");
            echo ezb_quote_recipient_email();
            update_option("ezb_quote_recipient_email", "");
          ' --allow-root)"
          test "$INVALID_DESTINATION" = "admin-fallback@example.com"

          # When neither destination is valid, fail closed instead of calling wp_mail.
          INVALID_BOTH="$(docker compose -f .devcontainer/docker-compose.yml run --rm --entrypoint wp bootstrap eval '
            update_option("ezb_quote_recipient_email", "not-an-email");
            // WordPress refuses to store an invalid admin_email; simulate a
            // malformed legacy DB value without mutating the protected option.
            add_filter("pre_option_admin_email", static function () { return "not-an-email"; });
            echo ezb_quote_recipient_email();
            remove_all_filters("pre_option_admin_email");
            update_option("ezb_quote_recipient_email", "");
          ' --allow-root)"
          test -z "$INVALID_BOTH"

          ERROR_CODE="$(curl -sS -o /tmp/error-submit-body.html -D /tmp/error-submit-headers.txt -w '%{http_code}'             -X POST 'http://127.0.0.1:8080/wp-admin/admin-post.php'             --data-urlencode 'action=ezb_quote'             --data-urlencode "ezb_quote_nonce=$NONCE"             --data-urlencode 'name=CI Missing Contact')"
          test "$ERROR_CODE" = "302"
          grep -qi 'location: .*quote_status=invalid' /tmp/error-submit-headers.txt

          curl -LsS 'http://127.0.0.1:8080/contact/?quote_status=invalid' -o /tmp/invalid-contact.html
          grep -q 'Please add your name and either a phone number or an email address.' /tmp/invalid-contact.html
          grep -q 'role="alert"' /tmp/invalid-contact.html

          INVALID_EMAIL_CODE="$(curl -sS -o /tmp/invalid-email-body.html -D /tmp/invalid-email-headers.txt -w '%{http_code}' \
            -X POST 'http://127.0.0.1:8080/wp-admin/admin-post.php' \
            --data-urlencode 'action=ezb_quote' \
            --data-urlencode "ezb_quote_nonce=$NONCE" \
            --data-urlencode 'name=CI Invalid Email' \
            --data-urlencode 'email=invalid-email')"
          test "$INVALID_EMAIL_CODE" = "302"
          grep -qi 'location: .*quote_status=invalid' /tmp/invalid-email-headers.txt

          # A crafted email[] field must be rejected, not crash sanitize_email().
          ARRAY_EMAIL_CODE="$(curl -sS -o /tmp/array-email-body.html -D /tmp/array-email-headers.txt -w '%{http_code}' \
            -X POST 'http://127.0.0.1:8080/wp-admin/admin-post.php' \
            --data-urlencode 'action=ezb_quote' \
            --data-urlencode "ezb_quote_nonce=$NONCE" \
            --data-urlencode 'name=CI Array Email' \
            --data-urlencode 'email[]=malformed@example.com')"
          test "$ARRAY_EMAIL_CODE" = "302"
          grep -qi 'location: .*quote_status=invalid' /tmp/array-email-headers.txt

          # A forged oversized message must be rejected before wp_mail is called.
          OVERSIZED_MESSAGE="$(printf '%16001s' '' | tr ' ' 'x')"
          OVERSIZED_CODE="$(curl -sS -o /tmp/oversized-submit-body.html -D /tmp/oversized-submit-headers.txt -w '%{http_code}' \
            -X POST 'http://127.0.0.1:8080/wp-admin/admin-post.php' \
            --data-urlencode 'action=ezb_quote' \
            --data-urlencode "ezb_quote_nonce=$NONCE" \
            --data-urlencode 'name=CI Oversized Message' \
            --data-urlencode 'email=ci-oversized@example.com' \
            --data-urlencode "message=$OVERSIZED_MESSAGE")"
          test "$OVERSIZED_CODE" = "302"
          grep -qi 'location: .*quote_status=too_long' /tmp/oversized-submit-headers.txt
          curl -LsS 'http://127.0.0.1:8080/contact/?quote_status=too_long' -o /tmp/too-long-contact.html
          grep -q 'Your enquiry is too long.' /tmp/too-long-contact.html
          HONEYPOT_CODE="$(curl -sS -o /tmp/honeypot-submit-body.html -D /tmp/honeypot-submit-headers.txt -w '%{http_code}'             -X POST 'http://127.0.0.1:8080/wp-admin/admin-post.php'             --data-urlencode 'action=ezb_quote'             --data-urlencode "ezb_quote_nonce=$NONCE"             --data-urlencode 'website=bot-filled-this'             --data-urlencode 'name=Bot')"
          test "$HONEYPOT_CODE" = "302"
          grep -qi 'location: .*quote_status=sent' /tmp/honeypot-submit-headers.txt

          INVALID_NONCE_CODE="$(curl -sS -o /tmp/invalid-nonce-body.html -w '%{http_code}'             -X POST 'http://127.0.0.1:8080/wp-admin/admin-post.php'             --data-urlencode 'action=ezb_quote'             --data-urlencode 'ezb_quote_nonce=invalid-nonce'             --data-urlencode 'name=Bad Nonce'             --data-urlencode 'phone=0400000000')"
          test "$INVALID_NONCE_CODE" = "403"
          grep -q 'Invalid request' /tmp/invalid-nonce-body.html

      - name: Verify reusable mail delivery probe contract
        shell: bash
        run: |
          set -euo pipefail
          EZB_BASE_URL=http://127.0.0.1:8080 \
          EZB_ALLOW_HTTP=1 \
          EZB_MAIL_PROBE_TOKEN=EZB-CI-MAIL-PROBE \
          bash scripts/mail-delivery-probe.sh | tee /tmp/mail-probe.log
          grep -q 'EZB_MAIL_PROBE_SUBMISSION_PASS' /tmp/mail-probe.log
          grep -q 'token=EZB-CI-MAIL-PROBE' /tmp/mail-probe.log
          grep -q 'MAILBOX_CONFIRMATION_REQUIRED' /tmp/mail-probe.log

      - name: Verify pretty URL canonical emission
        shell: bash
        run: |
          set -euo pipefail

          curl -sS             -H 'Host: preview-8080.app.github.dev'             -H 'X-Forwarded-Host: preview-8080.app.github.dev'             -H 'X-Forwarded-Proto: https'             'http://127.0.0.1:8080/roller-blinds/'             -o /tmp/canonical-roller.html

          grep -q 'rel="canonical"' /tmp/canonical-roller.html
          grep -Fq 'https://preview-8080.app.github.dev/roller-blinds/' /tmp/canonical-roller.html
          grep -Fq 'https://preview-8080.app.github.dev/wp-content/themes/ezb-theme/style.css' /tmp/canonical-roller.html
          grep -Fq 'https://preview-8080.app.github.dev/wp-content/themes/ezb-theme/assets/js/site.js' /tmp/canonical-roller.html
          ! grep -Fq 'https://localhost' /tmp/canonical-roller.html
          ! grep -Fq 'http://localhost' /tmp/canonical-roller.html
          ! grep -Fq 'https://127.0.0.1' /tmp/canonical-roller.html
          ! grep -Fq 'http://127.0.0.1' /tmp/canonical-roller.html
          ! grep -q 'ezb_page=roller-blinds' /tmp/canonical-roller.html

      - name: Verify legacy redirect and retirement registry
        shell: bash
        run: |
          set -euo pipefail

          REDIRECT_MAP="$(docker compose -f .devcontainer/docker-compose.yml run --rm --entrypoint wp bootstrap eval '
            $allowed_statuses = array( "verified_redirect", "gone" );
            $registry = ezb_legacy_redirect_registry();
            $verified = 0;
            $gone = 0;

            foreach ( $registry as $source => $entry ) {
              if ( $source !== ezb_normalise_request_path( $source ) ) {
                fwrite( STDERR, "non-normalised redirect source: " . $source . PHP_EOL );
                exit( 1 );
              }

              $status = isset( $entry["status"] ) ? $entry["status"] : "";
              $target = isset( $entry["target"] ) ? $entry["target"] : "";

              if ( ! in_array( $status, $allowed_statuses, true ) ) {
                fwrite( STDERR, "invalid redirect status: " . $source . " => " . $status . PHP_EOL );
                exit( 1 );
              }

              if ( "verified_redirect" === $status ) {
                $verified++;
                if ( "" === $target || $source === $target ) {
                  fwrite( STDERR, "verified redirect must have a non-self target: " . $source . PHP_EOL );
                  exit( 1 );
                }
              }

              if ( "gone" === $status ) {
                $gone++;
                if ( "" !== $target ) {
                  fwrite( STDERR, "gone route must not carry a redirect target: " . $source . PHP_EOL );
                  exit( 1 );
                }
              }

              echo $source . "|" . $status . "|" . $target . "|" . ezb_legacy_redirect_target( $source ) . "|" . ( ezb_legacy_gone_path( $source ) ? "gone" : "" ) . PHP_EOL;
            }

            echo "COUNTS|verified=" . $verified . "|gone=" . $gone . PHP_EOL;
          ' --allow-root)"

          printf '%s\n' "$REDIRECT_MAP" | grep -Fxq '/retractable-fly-screen/|verified_redirect|/retractable-flyscreens/|/retractable-flyscreens/|'
          printf '%s\n' "$REDIRECT_MAP" | grep -Fxq '/portfolio/|verified_redirect|/projects/|/projects/|'
          printf '%s\n' "$REDIRECT_MAP" | grep -Fxq '/portfolio/page/2/|verified_redirect|/projects/|/projects/|'
          printf '%s\n' "$REDIRECT_MAP" | grep -Fxq '/category/roller-blinds/|verified_redirect|/roller-blinds/|/roller-blinds/|'
          printf '%s\n' "$REDIRECT_MAP" | grep -Fxq '/2018/02/04/roller-blinds-showcase/|verified_redirect|/roller-blinds/|/roller-blinds/|'
          printf '%s\n' "$REDIRECT_MAP" | grep -Fxq '/2018/02/04/plantation-shutters-showcase/|verified_redirect|/plantation-shutters/|/plantation-shutters/|'
          printf '%s\n' "$REDIRECT_MAP" | grep -Fxq '/2018/10/06/retractable-fly-screen-showcase/|verified_redirect|/retractable-flyscreens/|/retractable-flyscreens/|'

          for source in \
            /roman-blinds/ \
            /panel-guide-blinds/ \
            /venetian-blinds/ \
            /portfolio/venetian-blinds/ \
            /2018/02/04/roman-blinds-showcase/ \
            /2018/02/04/panel-guide-blinds-showcase/ \
            /2018/02/04/venetian-blinds-showcase/; do
            printf '%s\n' "$REDIRECT_MAP" | grep -Fxq "$source|gone|||gone"
          done

          printf '%s\n' "$REDIRECT_MAP" | grep -Fxq 'COUNTS|verified=7|gone=7'

          # Development preview must not issue launch redirects or 410s.
          code="$(curl -sS -o /tmp/dev-legacy-route.html -w '%{http_code}' 'http://127.0.0.1:8080/portfolio/')"
          test "$code" != "301"
          code="$(curl -sS -o /tmp/dev-retired-route.html -w '%{http_code}' 'http://127.0.0.1:8080/roman-blinds/')"
          test "$code" != "410"

      - name: Verify fail-closed development indexing protection
        shell: bash
        run: |
          set -euo pipefail

          # Simulate an accidental database change that would normally allow indexing.
          docker compose -f .devcontainer/docker-compose.yml run --rm --entrypoint wp bootstrap option update blog_public 1 --allow-root >/dev/null

          curl -sS -D /tmp/dev-robots-headers.txt "http://127.0.0.1:8080/?ezb_page=products" -o /tmp/dev-robots-page.html
          grep -qi '^x-robots-tag:.*noindex' /tmp/dev-robots-headers.txt
          { grep -qi 'name="robots"' /tmp/dev-robots-page.html || grep -qi "name='robots'" /tmp/dev-robots-page.html; }
          grep -qi 'noindex' /tmp/dev-robots-page.html
          grep -qi 'nofollow' /tmp/dev-robots-page.html

          curl -sS "http://127.0.0.1:8080/robots.txt" -o /tmp/dev-robots.txt
          grep -Fxq 'User-agent: *' /tmp/dev-robots.txt
          grep -Fxq 'Disallow: /' /tmp/dev-robots.txt

          # Restore the normal development database setting.
          docker compose -f .devcontainer/docker-compose.yml run --rm --entrypoint wp bootstrap option update blog_public 0 --allow-root >/dev/null

      - name: Verify development safety and accessibility markers
        shell: bash
        run: |
          set -euo pipefail
          BLOG_PUBLIC="$(docker compose -f .devcontainer/docker-compose.yml run --rm --entrypoint wp bootstrap option get blog_public --allow-root)"
          echo "blog_public=$BLOG_PUBLIC"
          test "$BLOG_PUBLIC" = "0"

          curl -LsS http://127.0.0.1:8080/ -o /tmp/home.html
          grep -q 'Skip to content' /tmp/home.html
          grep -q 'wp--skip-link--target' /tmp/home.html
          grep -q '<main' /tmp/home.html

      - name: Verify visual interaction script is loaded
        shell: bash
        run: |
          set -euo pipefail
          curl -LsS http://127.0.0.1:8080/ -o /tmp/home-motion.html
          grep -q 'ezb-theme-site-js' /tmp/home-motion.html
          grep -Eq 'assets/js/site\.js\?ver=' /tmp/home-motion.html

      - name: Verify theme stylesheet is loaded
        shell: bash
        run: |
          set -euo pipefail
          curl -LsS http://127.0.0.1:8080/ -o /tmp/home-style.html
          grep -q 'ezb-theme-style-css' /tmp/home-style.html
          grep -Eq 'style\.css\?ver=' /tmp/home-style.html

      - name: Show service state
        if: always()
        run: docker compose -f .devcontainer/docker-compose.yml ps

      - name: Show logs on failure
        if: failure()
        run: docker compose -f .devcontainer/docker-compose.yml logs --no-color db wordpress bootstrap

      - name: Tear down
        if: always()
        run: docker compose -f .devcontainer/docker-compose.yml down -v
