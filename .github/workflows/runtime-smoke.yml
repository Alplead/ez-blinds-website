name: Runtime Smoke

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'wp-content/**'
      - '.devcontainer/**'
      - 'scripts/bootstrap*.sh'
      - 'scripts/link-check.mjs'
      - 'scripts/seo-audit.mjs'
      - 'scripts/host-readiness.mjs'
      - 'scripts/media-library-readiness.php'
      - 'scripts/check-owner-ui-acceptance.sh'
      - 'scripts/mail-delivery-probe.sh'
      - 'scripts/staging-media-acceptance.sh'
      - '.github/workflows/runtime-smoke.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wordpress-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Start the same Compose stack used by Codespaces
        run: docker compose -f .devcontainer/docker-compose.yml up -d --wait db wordpress

      - name: Run the same bootstrap used by Codespaces
        run: |
          docker compose -f .devcontainer/docker-compose.yml run --rm bootstrap | tee /tmp/bootstrap.log
          grep -q EZB_BOOTSTRAP_OK /tmp/bootstrap.log

      - name: Verify rendered pages
        shell: bash
        run: |
          set -euo pipefail
          for path in / /products/ /roller-blinds/ /sheer-curtains/ /plantation-shutters/ /retractable-flyscreens/ /motorised-blinds/ /projects/ /projects/retractable-flyscreen-large-opening/ /projects/retractable-flyscreen-indoor-outdoor-opening/ /projects/prototype-roller-blinds-project/ /projects/prototype-sheer-curtains-project/ /projects/prototype-retractable-flyscreen-project/ /advice/ /blog/ /roller-blinds-blockout-vs-sunscreen/ /sheer-curtains-privacy-layering/ /plantation-shutters-before-you-choose/ /retractable-flyscreen-track-threshold-planning/ /motorised-blinds-power-control-planning/ /advice/privacy-vs-daylight/ /advice/retractable-flyscreen-suitability/ /advice/when-motorisation-makes-sense/ /service-areas/ /about/ /contact/; do
            code="$(curl -LsS -o /tmp/page.html -w '%{http_code}' "http://127.0.0.1:8080$path")"
            echo "$path -> HTTP $code"
            test "$code" = "200"
          done

      - name: Verify skip link and production-safe primary navigation
        shell: bash
        run: |
          set -euo pipefail
          curl -sS 'http://127.0.0.1:8080/' -o /tmp/header-safety-page.html
          sed -n '/<header[ >]/,/<\/header>/p' /tmp/header-safety-page.html > /tmp/header-safety.html
          grep -q 'ezb-skip-link' /tmp/header-safety.html
          grep -q 'href="#main-content"' /tmp/header-safety.html
          grep -Eq 'href="/projects/"|ezb_page=projects' /tmp/header-safety.html
          ! grep -q '/projects/prototype-roller-blinds-project/' /tmp/header-safety.html
          ! grep -q '/projects/prototype-sheer-curtains-project/' /tmp/header-safety.html

      - name: Verify 404 fallback
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/404.html -w '%{http_code}' 'http://127.0.0.1:8080/this-page-should-not-exist-ezb/')"
          test "$code" = "404"
          grep -q 'That page is no longer here' /tmp/404.html
          grep -q '/products/' /tmp/404.html
          grep -q '/advice/' /tmp/404.html
          grep -q '/contact/' /tmp/404.html

      - name: Crawl internal pretty URLs for broken links
        shell: bash
        run: |
          set -euo pipefail
          EZB_BASE_URL=http://127.0.0.1:8080 EZB_LINK_CHECK_MAX=120 node scripts/link-check.mjs | tee /tmp/link-check.log
          grep -q 'EZB_LINK_CHECK_PASS' /tmp/link-check.log

      - name: Verify WordPress sitemap readiness
        shell: bash
        run: |
          set -euo pipefail

          docker compose -f .devcontainer/docker-compose.yml run --rm --entrypoint wp bootstrap option update blog_public 1 --allow-root >/dev/null

          code="$(curl -sS -o /tmp/wp-sitemap.xml -w '%{http_code}' 'http://127.0.0.1:8080/wp-sitemap.xml')"
          test "$code" = "200"
          grep -q 'wp-sitemap-posts-page-1.xml' /tmp/wp-sitemap.xml
          grep -q 'wp-sitemap-posts-post-1.xml' /tmp/wp-sitemap.xml
          grep -q 'wp-sitemap-posts-ezb_project-1.xml' /tmp/wp-sitemap.xml

          code="$(curl -sS -o /tmp/wp-sitemap-pages.xml -w '%{http_code}' 'http://127.0.0.1:8080/wp-sitemap-posts-page-1.xml')"
          test "$code" = "200"
          grep -q '/roller-blinds/' /tmp/wp-sitemap-pages.xml
          grep -q '/retractable-flyscreens/' /tmp/wp-sitemap-pages.xml
          grep -q '/advice/' /tmp/wp-sitemap-pages.xml
          grep -q '/contact/' /tmp/wp-sitemap-pages.xml

          code="$(curl -sS -o /tmp/wp-sitemap-posts.xml -w '%{http_code}' 'http://127.0.0.1:8080/wp-sitemap-posts-post-1.xml')"
          test "$code" = "200"
          grep -q '/roller-blinds-blockout-vs-sunscreen/' /tmp/wp-sitemap-posts.xml
          grep -q '/retractable-flyscreen-track-threshold-planning/' /tmp/wp-sitemap-posts.xml
          grep -q '/motorised-blinds-power-control-planning/' /tmp/wp-sitemap-posts.xml

          code="$(curl -sS -o /tmp/wp-sitemap-projects.xml -w '%{http_code}' 'http://127.0.0.1:8080/wp-sitemap-posts-ezb_project-1.xml')"
          test "$code" = "200"
          grep -q '/projects/retractable-flyscreen-large-opening/' /tmp/wp-sitemap-projects.xml
          grep -q '/projects/retractable-flyscreen-indoor-outdoor-opening/' /tmp/wp-sitemap-projects.xml
          ! grep -q 'owner-editability-test' /tmp/wp-sitemap-projects.xml

          docker compose -f .devcontainer/docker-compose.yml run --rm --entrypoint wp bootstrap option update blog_public 0 --allow-root >/dev/null

      - name: Verify owner-editable SEO descriptions
        shell: bash
        run: |
          set -euo pipefail

          docker compose -f .devcontainer/docker-compose.yml run --rm --entrypoint wp bootstrap eval '
            if ( ! post_type_supports( "page", "excerpt" ) ) {
              fwrite( STDERR, "Page excerpts are not enabled.\n" );
              exit( 1 );
            }
          ' --allow-root

          curl -LsS 'http://127.0.0.1:8080/' -o /tmp/seo-home.html
          test "$(grep -o 'name="description"' /tmp/seo-home.html | wc -l)" -eq 1
          grep -q 'content="Melbourne window furnishings"' /tmp/seo-home.html

          curl -LsS 'http://127.0.0.1:8080/roller-blinds/' -o /tmp/seo-roller.html
          test "$(grep -o 'name="description"' /tmp/seo-roller.html | wc -l)" -eq 1
          grep -q 'Roller blinds are a practical starting point for many rooms' /tmp/seo-roller.html
          grep -Eq '<title>[^<]*Roller Blinds[^<]*EZ Blinds' /tmp/seo-roller.html
          ! grep -q 'ezb_page=' /tmp/seo-roller.html

          curl -LsS 'http://127.0.0.1:8080/projects/retractable-flyscreen-large-opening/' -o /tmp/seo-project.html
          test "$(grep -o 'name="description"' /tmp/seo-project.html | wc -l)" -eq 1
          grep -q 'Development case-study shell' /tmp/seo-project.html

          curl -LsS 'http://127.0.0.1:8080/contact/' -o /tmp/seo-contact.html
          test "$(grep -o 'name="description"' /tmp/seo-contact.html | wc -l)" -eq 0

          curl -LsS 'http://127.0.0.1:8080/roller-blinds-blockout-vs-sunscreen/' -o /tmp/seo-blog.html
          test "$(grep -o 'name="description"' /tmp/seo-blog.html | wc -l)" -eq 1
          grep -q 'A practical starting guide to privacy, glare, daylight and room use' /tmp/seo-blog.html

          curl -sS 'http://127.0.0.1:8080/?ezb_page=roller-blinds' -o /tmp/seo-query-roller.html
          test "$(grep -o 'name="description"' /tmp/seo-query-roller.html | wc -l)" -eq 1
          grep -q 'Roller blinds are a practical starting point for many rooms' /tmp/seo-query-roller.html

      - name: Verify social metadata baseline
        shell: bash
        run: |
          set -euo pipefail

          curl -LsS 'http://127.0.0.1:8080/' -o /tmp/social-home.html
          test "$(grep -o 'property="og:title"' /tmp/social-home.html | wc -l)" -eq 1
          test "$(grep -o 'property="og:url"' /tmp/social-home.html | wc -l)" -eq 1
          test "$(grep -o 'name="twitter:card"' /tmp/social-home.html | wc -l)" -eq 1

          curl -LsS 'http://127.0.0.1:8080/roller-blinds-blockout-vs-sunscreen/' -o /tmp/social-blog.html
          test "$(grep -o 'property="og:title"' /tmp/social-blog.html | wc -l)" -eq 1
          grep -q 'property="og:type" content="article"' /tmp/social-blog.html
          grep -q 'property="og:description"' /tmp/social-blog.html
          grep -q 'name="twitter:description"' /tmp/social-blog.html

          curl -LsS 'http://127.0.0.1:8080/this-page-should-not-exist-ezb/' -o /tmp/social-404.html
          ! grep -q 'property="og:title"' /tmp/social-404.html

      - name: Verify conservative structured data
        shell: bash
        run: |
          set -euo pipefail

          curl -LsS 'http://127.0.0.1:8080/' -o /tmp/schema-home.html
          grep -q 'application/ld+json' /tmp/schema-home.html
          grep -q '"@type":"WebSite"' /tmp/schema-home.html

          curl -LsS 'http://127.0.0.1:8080/roller-blinds-blockout-vs-sunscreen/' -o /tmp/schema-blog.html
          grep -q 'application/ld+json' /tmp/schema-blog.html
          grep -q '"@type":"BlogPosting"' /tmp/schema-blog.html
          grep -q '"publisher":{"@type":"Organization"' /tmp/schema-blog.html
          ! grep -q '"@type":"LocalBusiness"' /tmp/schema-blog.html

      - name: Verify structured-data script escapes hostile title text
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f .devcontainer/docker-compose.yml run --rm --entrypoint wp bootstrap eval '
            $posts = get_posts(array("post_type"=>"post", "post_status"=>"publish", "numberposts"=>1));
            if (!$posts) { throw new Exception("No published test post"); }
            global $wp_query;
            $wp_query = new WP_Query(array("p"=>$posts[0]->ID, "post_type"=>"post"));
            $wp_query->the_post();
            add_filter("the_title", static function ($title) { return "</script><svg/onload=alert(1)>"; });
            ezb_print_structured_data();
          ' --allow-root > /tmp/schema-hostile-title.html
          grep -qF '\u003C/script\u003E' /tmp/schema-hostile-title.html
          ! grep -qF '</script><svg/onload' /tmp/schema-hostile-title.html
          test "$(grep -o '</script>' /tmp/schema-hostile-title.html | wc -l)" -eq 1

      - name: Audit title and canonical structure
        shell: bash
        run: |
          set -euo pipefail
          EZB_BASE_URL=http://127.0.0.1:8080 node scripts/seo-audit.mjs | tee /tmp/seo-audit.log
          grep -q 'EZB_SEO_AUDIT_PASS' /tmp/seo-audit.log

      - name: Verify reusable host readiness contract
        shell: bash
        run: |
          set -euo pipefail
          EZB_BASE_URL=http://127.0.0.1:8080 \
          EZB_ALLOW_HTTP=1 \
          EZB_EXPECT_INDEXABLE=0 \
          EZB_EXPECT_REDIRECTS=0 \
          EZB_ALLOW_DEV_TRANSPORT=1 \
          node scripts/host-readiness.mjs | tee /tmp/host-readiness.log
          grep -q 'EXTERNAL_MAIL_DELIVERY=MANUAL_GATE' /tmp/host-readiness.log
          grep -q 'EZB_HOST_READINESS_PASS' /tmp/host-readiness.log

      - name: Verify prototype records exist
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f .devcontainer/docker-compose.yml run --rm --entrypoint wp bootstrap post list --post_type=page --name=privacy-vs-daylight --field=ID --allow-root | grep -q .
          docker compose -f .devcontainer/docker-compose.yml run --rm --entrypoint wp bootstrap post list --post_type=page --name=retractable-flyscreen-suitability --field=ID --allow-root | grep -q .
          docker compose -f .devcontainer/docker-compose.yml run --rm --entrypoint wp bootstrap post list --post_type=page --name=when-motorisation-makes-sense --field=ID --allow-root | grep -q .
          docker compose -f .devcontainer/docker-compose.yml run --rm --entrypoint wp bootstrap post list --post_type=post --name=retractable-flyscreen-track-threshold-planning --field=ID --allow-root | grep -q .
          docker compose -f .devcontainer/docker-compose.yml run --rm --entrypoint wp bootstrap post list --post_type=post --name=motorised-blinds-power-control-planning --field=ID --allow-root | grep -q .
          docker compose -f .devcontainer/docker-compose.yml run --rm --entrypoint wp bootstrap post list --post_type=ezb_project --name=prototype-roller-blinds-project --field=ID --allow-root | grep -q .
          docker compose -f .devcontainer/docker-compose.yml run --rm --entrypoint wp bootstrap post list --post_type=ezb_project --name=retractable-flyscreen-large-opening --field=ID --allow-root | grep -q .
          docker compose -f .devcontainer/docker-compose.yml run --rm --entrypoint wp bootstrap post list --post_type=ezb_project --name=retractable-flyscreen-indoor-outdoor-opening --field=ID --allow-root | grep -q .
          OWNER_TEST_ID="$(docker compose -f .devcontainer/docker-compose.yml run --rm --entrypoint wp bootstrap post list --post_type=ezb_project --name=owner-editability-test --post_status=draft --field=ID --allow-root | head -1)"
          test -n "$OWNER_TEST_ID"
          test "$(docker compose -f .devcontainer/docker-compose.yml run --rm --entrypoint wp bootstrap post get "$OWNER_TEST_ID" --field=post_status --allow-root)" = "draft"

      - name: Verify forwarded host URL handling
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -D /tmp/headers.txt -o /tmp/forwarded.html             -H 'Host: preview-8080.app.github.dev'             -H 'X-Forwarded-Host: preview-8080.app.github.dev'             -H 'X-Forwarded-Proto: https'             http://127.0.0.1:8080/advice/
          grep -q 'preview-8080.app.github.dev' /tmp/forwarded.html
          ! grep -q 'localhost/advice' /tmp/headers.txt

      - name: Verify active preview host stays canonical
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -D /tmp/preview-headers.txt -o /tmp/preview-body.html             -H 'Host: preview-8080.app.github.dev'             -H 'X-Forwarded-Host: preview-8080.app.github.dev'             -H 'X-Forwarded-Proto: https'             http://127.0.0.1:8080/advice/privacy-vs-daylight/
          ! grep -qi 'location: http://localhost' /tmp/preview-headers.txt
          ! grep -qi 'location: https://localhost' /tmp/preview-headers.txt

      - name: Verify development URL bridge
        shell: bash
        run: |
          set -euo pipefail
          curl -LsS http://127.0.0.1:8080/ -o /tmp/home-bridge.html
          grep -q 'id="ezb-codespaces-url-bridge"' /tmp/home-bridge.html

      - name: Verify development prototype router
        shell: bash
        run: |
          set -euo pipefail
          for key in products roller-blinds sheer-curtains plantation-shutters retractable-flyscreens motorised-blinds projects advice blog privacy-vs-daylight retractable-flyscreen-suitability when-motorisation-makes-sense service-areas about contact; do
            code="$(curl -sS -o /tmp/prototype.html -w '%{http_code}' "http://127.0.0.1:8080/?ezb_page=$key")"
            echo "$key -> HTTP $code"
            test "$code" = "200"
          done
          grep -q 'id="ezb-codespaces-url-bridge"' /tmp/prototype.html

      - name: Verify malformed development query arrays are harmless
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/prototype-malformed-key.html -w '%{http_code}' 'http://127.0.0.1:8080/?ezb_page%5B%5D=products')"
          test "$code" = "400"
          grep -q 'Invalid development route request.' /tmp/prototype-malformed-key.html
          ! grep -q 'Fatal error' /tmp/prototype-malformed-key.html
          code="$(curl -sS -o /tmp/prototype-malformed-project.html -w '%{http_code}' 'http://127.0.0.1:8080/?ezb_page=project&ezb_project%5B%5D=unknown')"
          test "$code" = "400"
          grep -q 'Invalid development route request.' /tmp/prototype-malformed-project.html
          ! grep -q 'Fatal error' /tmp/prototype-malformed-project.html

      - name: Verify prototype links are server-rewritten
        shell: bash
        run: |
          set -euo pipefail
          curl -sS "http://127.0.0.1:8080/?ezb_page=advice" -o /tmp/advice-router.html
          grep -q 'ezb_page=products' /tmp/advice-router.html
          grep -q 'ezb_page=advice' /tmp/advice-router.html
          grep -q 'ezb_page=about' /tmp/advice-router.html
          ! grep -q 'href="http://localhost' /tmp/advice-router.html
          ! grep -q 'href="https://localhost' /tmp/advice-router.html

          curl -sS "http://127.0.0.1:8080/?ezb_page=projects" -o /tmp/projects-router.html
          grep -q 'ezb_page=project' /tmp/projects-router.html
          grep -q 'prototype-roller-blinds-project' /tmp/projects-router.html
          ! grep -q 'owner-editability-test' /tmp/projects-router.html

      - name: Verify prototype query routes load theme assets
        shell: bash
        run: |
          set -euo pipefail
          curl -sS "http://127.0.0.1:8080/?ezb_page=advice" -o /tmp/query-advice.html
          grep -q 'ezb-theme-style-css' /tmp/query-advice.html
          grep -q 'id="ezb-codespaces-url-bridge"' /tmp/query-advice.html
          grep -q '<meta name="viewport"' /tmp/query-advice.html

      - name: Verify dropdown navigation and prototype media cards
        shell: bash
        run: |
          set -euo pipefail
          curl -sS "http://127.0.0.1:8080/" -o /tmp/home-nav.html
          grep -q 'Products' /tmp/home-nav.html
          grep -q 'Roller Blinds' /tmp/home-nav.html
          grep -q 'Projects' /tmp/home-nav.html
          grep -q 'Advice' /tmp/home-nav.html

          curl -sS "http://127.0.0.1:8080/?ezb_page=products" -o /tmp/products-cards.html
          grep -q 'ezb-card-media' /tmp/products-cards.html

          curl -sS "http://127.0.0.1:8080/?ezb_page=projects" -o /tmp/projects-cards.html
          grep -q 'ezb-card-media--project' /tmp/projects-cards.html

          curl -sS "http://127.0.0.1:8080/?ezb_page=advice" -o /tmp/advice-cards.html
          grep -q 'ezb-card-media--advice' /tmp/advice-cards.html

          curl -sS "http://127.0.0.1:8080/?ezb_page=blog" -o /tmp/blog-index.html
          grep -q 'Blockout or sunscreen roller blinds' /tmp/blog-index.html
          grep -q 'Retractable flyscreen tracks and thresholds: what should you check?' /tmp/blog-index.html
          grep -q 'ezb-blog-card' /tmp/blog-index.html

      - name: Verify genuine-media slot fallbacks
        shell: bash
        run: |
          set -euo pipefail

          check_slot() {
            label="$1"
            url="$2"
            file="/tmp/media-$label.html"
            echo "Checking media slot: $label -> $url"
            curl -sS "$url" -o "$file"

            if ! grep -q 'REAL EZ PROJECT MEDIA' "$file"; then
              echo "MISSING REAL EZ PROJECT MEDIA marker on $label"
              grep -o -E 'ezb-media[^"< ]*|REAL EZ[^<]*' "$file" | head -30 || true
              exit 1
            fi

            if ! grep -q 'ezb-media-slot' "$file"; then
              echo "MISSING ezb-media-slot wrapper on $label"
              grep -o -E 'ezb-media[^"< ]*|REAL EZ[^<]*' "$file" | head -30 || true
              exit 1
            fi
          }

          check_slot roller "http://127.0.0.1:8080/?ezb_page=roller-blinds"
          check_slot shutters "http://127.0.0.1:8080/?ezb_page=plantation-shutters"
          check_slot rfs "http://127.0.0.1:8080/?ezb_page=retractable-flyscreens"

      - name: Verify WebP derivative resolves by source stem
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f .devcontainer/docker-compose.yml run --rm --entrypoint sh bootstrap -lc "printf '%s' 'UklGRiQAAABXRUJQVlA4IBgAAAAwAQCdASoCAAIAAUAmJaQAA3AA/vz0AAA=' | base64 -d > '/tmp/IMAG3884~2.webp' && wp media import '/tmp/IMAG3884~2.webp' --porcelain --allow-root"
          curl -sS "http://127.0.0.1:8080/?ezb_page=roller-blinds" -o /tmp/media-webp.html
          grep -q 'ezb-media-slot__image' /tmp/media-webp.html
          ! grep -q 'Roller Blinds — real EZ project media' /tmp/media-webp.html

          docker compose -f .devcontainer/docker-compose.yml run --rm --entrypoint sh bootstrap -lc "printf '%s' 'UklGRiQAAABXRUJQVlA4IBgAAAAwAQCdASoCAAIAAUAmJaQAA3AA/vz0AAA=' | base64 -d > '/tmp/EZ blinds and shutters Retractable Flyscreen S 01.webp' && wp media import '/tmp/EZ blinds and shutters Retractable Flyscreen S 01.webp' --porcelain --allow-root"
          curl -sS "http://127.0.0.1:8080/?ezb_page=retractable-flyscreens" -o /tmp/media-rfs-webp.html
          grep -q 'ezb-media-slot__image' /tmp/media-rfs-webp.html

          curl -sS "http://127.0.0.1:8080/?ezb_page=project&ezb_project=retractable-flyscreen-large-opening" -o /tmp/project-media-webp.html
          grep -q 'ezb-project-gallery' /tmp/project-media-webp.html
          grep -q 'ezb-project-gallery__image' /tmp/project-media-webp.html
          grep -q 'Visual grouping only; project facts remain unverified.' /tmp/project-media-webp.html

          curl -sS "http://127.0.0.1:8080/?ezb_page=project&ezb_project=retractable-flyscreen-indoor-outdoor-opening" -o /tmp/project-media-group-b.html
          grep -q 'ezb-project-gallery' /tmp/project-media-group-b.html
          test "$(grep -o 'ezb-project-gallery__placeholder' /tmp/project-media-group-b.html | wc -l)" -eq 3
          grep -q 'Only the visual grouping is treated as verified at this stage.' /tmp/project-media-group-b.html

      - name: Verify real-media aspect-aware gallery fit rules
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f .devcontainer/docker-compose.yml run --rm --entrypoint wp bootstrap eval '
            $cases = array(
              array( 1200, 1602, "contain" ),
              array( 1500, 2000, "contain" ),
              array( 2000, 774, "contain" ),
              array( 2000, 1500, "cover" ),
              array( 1920, 1080, "cover" ),
              array( 1600, 1200, "cover" ),
            );
            foreach ( $cases as $case ) {
              $actual = ezb_product_gallery_fit_mode( $case[0], $case[1] );
              if ( $actual !== $case[2] ) {
                fwrite( STDERR, "fit-mode mismatch for " . $case[0] . "x" . $case[1] . ": " . $actual . PHP_EOL );
                exit( 1 );
              }
            }
            echo "EZB_MEDIA_ASPECT_FIT_PASS" . PHP_EOL;
          ' --allow-root

      - name: Verify media library readiness checker contract
        shell: bash
        run: |
          set -euo pipefail

          if docker compose -f .devcontainer/docker-compose.yml run --rm --entrypoint wp bootstrap \
            eval-file /opt/ezb-scripts/media-library-readiness.php --allow-root >/tmp/media-readiness-negative.log 2>&1; then
            echo "Empty development Media Library unexpectedly passed the 25-asset readiness check."
            exit 1
          fi
          grep -q 'EZB_MEDIA_READINESS_FAIL' /tmp/media-readiness-negative.log

          docker compose -f .devcontainer/docker-compose.yml run --rm --entrypoint sh bootstrap -lc '
            set -eu
