name: EZ2 Homepage Photo Integration (No Deployment)
on:
  pull_request:
    branches:
      - feature/vertical-slice-v1
    paths:
      - 'wp-content/themes/ezb-theme/patterns/core-solutions.php'
      - 'wp-content/themes/ezb-theme/assets/css/editorial.css'
      - 'wp-content/themes/ezb-theme/templates/front-page.html'
      - 'scripts/test_ez2_homepage_photo_stories.py'
      - 'scripts/ez2-photo-readiness.php'
      - 'scripts/test_ez2_photo_readiness.php'
      - 'scripts/test_ez2_media_loading.php'
      - 'scripts/ez2_validate_private_webp_bundle.py'
      - 'scripts/test_ez2_validate_private_webp_bundle.py'
      - 'wp-content/plugins/ezb-core/ezb-core.php'
      - 'wp-content/plugins/ezb-core/includes/ezb-media-priority.php'
      - 'wp-content/plugins/ezb-core/includes/ezb-editorial-visuals.php'
      - '.github/workflows/ez2-homepage-photo-integration.yml'
permissions:
  contents: read
jobs:
  integration-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Check existing page architecture and meaningful product photo slots
        run: |
          set -euo pipefail
          php -l wp-content/themes/ezb-theme/patterns/core-solutions.php
          python3 scripts/test_ez2_homepage_photo_stories.py | tee /tmp/ez2-homepage-test.log
          grep -Fxq 'EZ2_HOMEPAGE_PHOTO_STORIES_PASS cases=47' /tmp/ez2-homepage-test.log
      - name: Verify fast mobile images and block bare previews
        run: |
          set -euo pipefail
          php -l wp-content/plugins/ezb-core/ezb-core.php
          php -l wp-content/plugins/ezb-core/includes/ezb-media-priority.php
          php -l wp-content/plugins/ezb-core/includes/ezb-editorial-visuals.php
          php -l scripts/ez2-photo-readiness.php
          php -l scripts/test_ez2_media_loading.php
          php -l scripts/test_ez2_photo_readiness.php
          php scripts/test_ez2_media_loading.php | tee /tmp/ez2-media-loading.log
          grep -Fxq 'EZ2_MEDIA_LOADING_PRIORITY_PASS cases=16' /tmp/ez2-media-loading.log
          php scripts/test_ez2_photo_readiness.php | tee /tmp/ez2-photo-readiness.log
          grep -Fxq 'EZ2_REAL_PHOTO_PREVIEW_GATE_PASS cases=12' /tmp/ez2-photo-readiness.log
          echo EZ2_OWNER_VISUAL_PREVIEW_GATE_PASS
      - name: Prove safe SHA256 handoff of private Owner media
        run: |
          set -euo pipefail
          python3 scripts/test_ez2_validate_private_webp_bundle.py | tee /tmp/ez2-private-webp.log
          grep -Fxq 'EZ2_PRIVATE_WEBP_MANIFEST_TEST_PASS cases=9' /tmp/ez2-private-webp.log
          echo EZ2_PRIVATE_PHOTOS_NEVER_IN_GITHUB_PASS
      - name: Preserve private media boundary
        run: |
          set -euo pipefail
          ! grep -Eiq 'drive\\.google|images\\.unsplash|api_key|secret_key' wp-content/themes/ezb-theme/patterns/core-solutions.php
          echo EZ2_OWNER_MEDIA_STAYS_IN_PRIVATE_WORDPRESS_PASS
