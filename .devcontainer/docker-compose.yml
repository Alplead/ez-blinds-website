services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 3s
      timeout: 3s
      retries: 40

  wordpress:
    image: wordpress:7.1-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'development');
        // Keep warnings visible in container logs, not inside HTTP responses:
        // a WordPress.org update-check timeout must not corrupt form redirects.
        define('WP_DEBUG_DISPLAY', false);
    volumes:
      - wp_data:/var/www/html
      - ../wp-content/themes/ezb-theme:/var/www/html/wp-content/themes/ezb-theme
      - ../wp-content/plugins/ezb-core:/var/www/html/wp-content/plugins/ezb-core

  bootstrap:
    image: wordpress:cli
    user: "0:0"
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html
      - ../wp-content/themes/ezb-theme:/var/www/html/wp-content/themes/ezb-theme
      - ../wp-content/plugins/ezb-core:/var/www/html/wp-content/plugins/ezb-core
      - ../scripts:/opt/ezb-scripts:ro
    entrypoint: ["/bin/sh", "/opt/ezb-scripts/bootstrap-compose.sh"]
    restart: "no"

  workspace:
    image: mcr.microsoft.com/devcontainers/php:1-8.3-bookworm
    command: sleep infinity
    volumes:
      - ..:/workspaces/ez-blinds-website:cached
    depends_on:
      bootstrap:
        condition: service_completed_successfully

volumes:
  db_data:
  wp_data:
